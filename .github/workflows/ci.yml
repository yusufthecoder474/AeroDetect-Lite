name: AeroDetect-Lite — Python core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies (no model download)
        run: python -m pip install -r requirements-ci.txt
      - name: Run core tests
        run: |
          set -o pipefail
          python -m pytest -v | tee ci-pytest.log
      - name: Save test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aero-pytest-${{ github.run_number }}
          path: ci-pytest.log
          if-no-files-found: ignore
          retention-days: 7
